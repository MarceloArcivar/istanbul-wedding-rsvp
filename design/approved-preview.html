<title>Istanbul Wedding RSVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: dusk-over-the-Bosphorus hero drawn on canvas, a single invitation card rising out of the water, Iznik-tile edge as the one ornament */
:root{
  --night:#232f41;      /* sky / page ground */
  --ink:#0d1230;        /* deepest water */
  --card:#fbf6ec;       /* invitation paper */
  --card-ink:#1b2149;   /* text on paper */
  --muted:#6b6f8c;
  --iznik:#1f5fa8;      /* cobalt tile blue */
  --turq:#2a9d9a;       /* turquoise */
  --saffron:#d99a2b;    /* sunset gold */
  --rose:#c4566a;
  --line:#e4dccb;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--card);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:3px}

/* preview bar */
.pbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#1a2433;border-bottom:1px solid #3a4a63;font-size:13px;color:#cfe3e3}
.pbar strong{color:var(--saffron);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.pbar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pbar select{background:#232f41;color:var(--card);border:1px solid #46587a;border-radius:6px;padding:5px 8px;max-width:100%}
.pbar a.tab{padding:5px 10px;border-radius:6px;border:1px solid #46587a;text-decoration:none}
.pbar a.tab[aria-current="true"]{background:var(--saffron);border-color:var(--saffron);color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;background:#fbfdfd}
.skyline{display:block;width:100%;max-width:100%;height:clamp(190px,30vw,380px);object-fit:cover;object-position:50% 100%;margin-top:-6px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%);mask-image:linear-gradient(180deg,transparent 0,#000 14%)}
.water{height:110px;background:linear-gradient(180deg,#b3d0eb 0%,var(--night) 100%);margin-top:-1px}
.langs{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px;background:rgba(35,47,65,.07);z-index:2;border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:#232f41;padding:4px 11px;border-radius:999px;font-size:12px;letter-spacing:.12em;cursor:pointer}
.langs button[aria-pressed="true"]{background:#232f41;color:#fff}
.hero-text{position:relative;z-index:1;text-align:center;padding:64px 16px 0}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#56657d}
.mono{font-family:var(--display);font-weight:400;font-size:clamp(54px,11vw,92px);line-height:1;margin:.15em 0 0;color:#232f41}
.mono i{font-style:italic;color:#d99a3a;font-size:.62em;vertical-align:.18em;margin:0 .12em}

/* invitation card */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.card{position:relative;max-width:560px;margin:-70px auto 0;padding-top:1px;background:var(--card);color:var(--card-ink);border-radius:4px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.flourish{display:flex;align-items:center;gap:10px;margin:22px clamp(20px,6vw,44px) 0}
.flourish::before,.flourish::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#4f7cae)}
.flourish::after{background:linear-gradient(90deg,#4f7cae,transparent)}
.flourish svg{width:120px;height:24px;flex:none}
.inner{padding:30px clamp(20px,6vw,44px) 34px;display:grid;gap:22px}
.portrait{position:relative;z-index:2;display:block;width:min(210px,54vw);aspect-ratio:2/3;max-width:100%;margin:-90px auto 0;object-fit:cover;object-position:50% 40%;border-radius:999px 999px 10px 10px;box-shadow:0 0 0 6px var(--card),0 0 0 8px #4f7cae,0 24px 40px -18px rgba(0,0,0,.55)}
.tulip{display:flex;align-items:center;gap:14px}
.tulip::before,.tulip::after{content:"";flex:1;height:1px;background:var(--line)}
.tulip svg{width:22px;height:30px;flex:none}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--iznik);font-weight:500;text-align:center}
.meta span+span::before{content:"◆";color:var(--saffron);margin-right:18px;font-size:8px;vertical-align:2px}
h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:clamp(30px,7vw,40px);line-height:1.15;margin:0;text-align:center;text-wrap:balance}
.intro{margin:0;color:#3a3f63;text-align:center;font-weight:300;font-size:17px}
.party{justify-self:center;font-size:14px;color:var(--card-ink);background:#efe6d2;border-radius:999px;padding:6px 16px}
.divider{height:1px;background:var(--line)}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-align:center;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:grid;gap:2px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:14px 14px 13px;cursor:pointer;color:var(--card-ink);transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:#c9bfa8}
.opt .dot{width:10px;height:10px;border-radius:50%;margin-bottom:6px}
.opt b{font-weight:500;font-size:15px;line-height:1.3}
.opt[aria-checked="true"]{border-color:var(--iznik);background:#eef3fb}
.opt[aria-checked="true"]::after{content:"✓";position:absolute;top:10px;right:12px;color:var(--iznik);font-weight:600}
.count{display:grid;gap:10px;justify-items:center}
.count p{margin:0;font-size:15px}
.stepper{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px;background:#fff}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:#efe6d2;color:var(--card-ink);font-size:20px;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:64px;text-align:center;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stepper small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);margin-top:-4px}
.send{justify-self:center;border:0;border-radius:999px;padding:14px 34px;background:var(--iznik);color:#fff;font-weight:500;letter-spacing:.06em;cursor:pointer;font-size:15px}
.send:disabled{background:#b9bccf;cursor:default}
.fine{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.fine strong{color:var(--rose);font-weight:500}
.thanks{display:grid;gap:14px;justify-items:center;text-align:center}
.thanks .seal{width:64px;height:64px;border-radius:50%;background:var(--iznik);color:#fff;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:26px;box-shadow:0 0 0 6px #e3ebf7}
.thanks p{margin:0}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 20px;color:var(--card-ink);cursor:pointer}
.note{margin:0;font-size:13px;color:var(--muted);text-align:center;font-style:italic}

/* dashboard */
.dash{max-width:880px;margin:28px auto 0;display:grid;gap:22px}
.dash h1{text-align:left;color:var(--card);font-style:normal}
.dash .sub{margin:-12px 0 0;color:#cfe3e3;font-size:14px}
.headline{background:var(--card);color:var(--card-ink);border-radius:6px;padding:22px 24px;display:grid;gap:4px}
.headline .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--iznik);font-weight:500}
.headline .big{font-family:var(--display);font-size:clamp(40px,9vw,58px);line-height:1.05;font-variant-numeric:tabular-nums}
.headline p{margin:0;color:#3a3f63;font-size:14px}
.tilesrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:#2c3a50;border:1px solid #3a4a63;border-radius:6px;padding:14px 16px;display:grid;gap:2px}
.tile .n{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.tile .t{font-size:13px;color:#d6e8e8;display:flex;align-items:center;gap:7px}
.tile .t i{width:9px;height:9px;border-radius:50%;display:inline-block}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#3a4a63}
.bar span{display:block;height:100%}
.tablewrap{overflow-x:auto;background:var(--card);border-radius:6px}
table{width:100%;border-collapse:collapse;color:var(--card-ink);font-size:14px;min-width:560px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid #efe8d9;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%}
.ex{font-size:11px;color:var(--muted);margin-left:6px}
.dash .foot{color:#b3d0d1;font-size:13px;margin:0}
.reset{justify-self:start;border:1px solid #46587a;background:transparent;color:#d6e8e8;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}

@media (max-width:420px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function saveLocal(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
let local = loadLocal();
function replyFor(id){ if(local[id]) return {...local[id],example:false}; if(EXAMPLE[id]) return {...EXAMPLE[id],example:true}; return null; }

/* ---------- state ---------- */
let lang="es", guest=GUESTS[0], draft={s:null,c:1}, editing=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  $("#eyebrow").textContent=T[l].eyebrow;
  renderGuest();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function renderGuest(){
  const t=T[lang], g=guest, r=local[g.id];
  const inner=$("#inner");
  const head=`
    <div class="meta"><span>${t.when}</span><span>${t.where}</span></div>
    <h1>${esc(t.hi(g.name))}</h1>
    <p class="intro">${t.intro}</p>
    <div class="party">${g.size===1?t.p1:t.pn(g.size)}</div>
    <div class="tulip" aria-hidden="true"><svg viewBox="0 0 22 30"><path d="M11 2C7 6 5 10 6 14c1 3 3 4 5 4s4-1 5-4c1-4-1-8-5-12Z" fill="#c4566a"/><path d="M11 6c-1.6 3-2 6-1 9" stroke="#fbf6ec" stroke-width="1" fill="none"/><path d="M11 18v11M11 25c-3-1-5-3-6-6M11 23c3-1 5-3 6-6" stroke="#2a9d9a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>`;
  if(r && !editing){
    const st=STATUS[r.s], going=(r.s==="yes"||r.s==="likely_yes");
    inner.innerHTML=head+`
      <div class="thanks">
        <div class="seal">M&amp;M</div>
        <h2>${esc(t.thanks(g.name))}</h2>
        <p>${t.got} <span class="chip" style="background:${st.bg};color:#1b2149"><i style="background:${st.col}"></i>${st[lang]}</span>${going&&g.size>1?` · ${t.people(r.c)}`:""}</p>
        <p class="fine">${t.canChange}</p>
        <button class="ghost" id="chg">${t.change}</button>
      </div>
      <p class="note">${t.note}</p>`;
    $("#chg").onclick=()=>{editing=true;draft={s:r.s,c:r.c||g.size};renderGuest()};
    return;
  }
  const going=(draft.s==="yes"||draft.s==="likely_yes");
  inner.innerHTML=head+`
    <h2>${g.size===1?t.q1:t.qn}</h2>
    <div class="opts" role="radiogroup">
      ${Object.entries(STATUS).map(([k,v])=>`
        <button class="opt" role="radio" aria-checked="${draft.s===k}" data-s="${k}">
          <span class="dot" style="background:${v.col}"></span><b>${v[lang]}</b>
        </button>`).join("")}
    </div>
    ${g.size>1&&going?`
    <div class="count">
      <p>${t.howMany}</p>
      <div class="stepper">
        <button id="minus" aria-label="−" ${draft.c<=1?"disabled":""}>−</button>
        <output id="cnt">${draft.c}<small>${t.of(g.size)}</small></output>
        <button id="plus" aria-label="+" ${draft.c>=g.size?"disabled":""}>+</button>
      </div>
    </div>`:""}
    <button class="send" id="send" ${draft.s?"":"disabled"}>${t.send}</button>
    <p class="fine">${t.by(DEADLINE[lang])}</p>
    <p class="note">${t.note}</p>`;
  inner.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{draft.s=b.dataset.s;renderGuest()});
  if($("#minus")){ $("#minus").onclick=()=>{draft.c=Math.max(1,draft.c-1);renderGuest()};
                   $("#plus").onclick=()=>{draft.c=Math.min(g.size,draft.c+1);renderGuest()}; }
  $("#send").onclick=()=>{
    if(!draft.s) return;
    const going=(draft.s==="yes"||draft.s==="likely_yes");
    local[g.id]={s:draft.s,c:going?(g.size===1?1:draft.c):0,at:new Date().toISOString()};
    saveLocal(local); editing=false; renderGuest();
  };
}

function renderDash(){
  let invited=0,yes=0,ly=0,ln=0,no=0,pend=0, answeredParties=0;
  const rows=GUESTS.map(g=>{
    invited+=g.size; const r=replyFor(g.id);
    if(!r){pend+=g.size;}
    else{answeredParties++;
      if(r.s==="yes")yes+=r.c; else if(r.s==="likely_yes")ly+=r.c;
      else if(r.s==="likely_no")ln+=g.size; else no+=g.size;
      // people in a party who said "fewer than all" count as not coming
      if((r.s==="yes"||r.s==="likely_yes")&&r.c<g.size) no+=g.size-r.c;
    }
    return {g,r};
  });
  const pct=n=>invited?(n/invited*100):0;
  const lbl=k=>STATUS[k].en;
  $("#dashView").innerHTML=`
    <div><h1>Replies</h1></div>
    <p class="sub">${answeredParties} of ${GUESTS.length} invitations answered · deadline ${DEADLINE.en}</p>
    <div class="headline">
      <span class="lbl">Expected headcount</span>
      <span class="big">${yes}${ly?` – ${yes+ly}`:""}</span>
      <p>${yes} confirmed${ly?`, up to ${yes+ly} if everyone leaning yes comes`:""}. Plan the venue for the upper number.</p>
    </div>
    <div class="bar" aria-hidden="true">
      <span style="width:${pct(yes)}%;background:${STATUS.yes.col}"></span>
      <span style="width:${pct(ly)}%;background:${STATUS.likely_yes.col}"></span>
      <span style="width:${pct(ln)}%;background:${STATUS.likely_no.col}"></span>
      <span style="width:${pct(no)}%;background:${STATUS.no.col}"></span>
    </div>
    <div class="tilesrow">
      <div class="tile"><span class="n">${invited}</span><span class="t">People invited</span></div>
      <div class="tile"><span class="n">${yes}</span><span class="t"><i style="background:${STATUS.yes.col}"></i>${lbl("yes")}</span></div>
      <div class="tile"><span class="n">${ly}</span><span class="t"><i style="background:${STATUS.likely_yes.col}"></i>${lbl("likely_yes")}</span></div>
      <div class="tile"><span class="n">${ln}</span><span class="t"><i style="background:${STATUS.likely_no.col}"></i>${lbl("likely_no")}</span></div>
      <div class="tile"><span class="n">${no}</span><span class="t"><i style="background:${STATUS.no.col}"></i>Not coming</span></div>
      <div class="tile"><span class="n">${pend}</span><span class="t"><i style="background:#3a4a63;border:1px solid #6b6f8c"></i>No reply yet</span></div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Invitation</th><th>Invited</th><th>Answer</th><th>Coming</th><th>Language</th></tr></thead>
      <tbody>${rows.map(({g,r})=>`<tr>
        <td><a href="#${g.id}">${esc(g.name)}</a>${r&&r.example?'<span class="ex">example</span>':""}</td>
        <td class="num">${g.size}</td>
        <td>${r?`<span class="chip" style="background:${STATUS[r.s].bg}"><i style="background:${STATUS[r.s].col}"></i>${lbl(r.s)}</span>`:'<span class="chip" style="background:#efe8d9;color:#6b6f8c">No reply yet</span>'}</td>
        <td class="num">${r?(r.s==="yes"||r.s==="likely_yes"?r.c:0):"–"}</td>
        <td>${g.lang.toUpperCase()}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="foot">Preview: replies you send from the guest page are saved in this browser only. Rows marked "example" are made-up.</p>
    <button class="reset" id="reset">Clear my test replies</button>`;
  $("#reset").onclick=()=>{local={};saveLocal(local);renderDash()};
}

/* ---------- routing ---------- */
const sel=$("#who");
sel.innerHTML=GUESTS.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.size}) · ${g.lang.toUpperCase()}</option>`).join("");
sel.onchange=()=>{location.hash=sel.value};
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const dash=h==="replies";
  $("#guestView").hidden=dash; $("#dashView").hidden=!dash; $("#hero").hidden=dash;
  $("#tabDash").setAttribute("aria-current",dash); $("#tabGuest").setAttribute("aria-current",!dash);
  if(dash){renderDash();return;}
  guest=GUESTS.find(g=>g.id===h)||GUESTS[0];
  sel.value=guest.id; $("#tabGuest").href="#"+guest.id;
  const r=local[guest.id]; editing=false; draft={s:null,c:guest.size};
  setLang(guest.lang); drawSky();
}
window.addEventListener("hashchange",route);

/* ---------- Istanbul at dusk (canvas) ---------- */
function drawSky(){}
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawSky,120)});
route();
</script>
